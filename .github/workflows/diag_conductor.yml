name: DIAGNOSTICO temporal - conductor y motivo de rotura

# Desechable: ver si Conductor, Motivo_Rotura, Tipo_Reparacion y diagnostico
# vienen cargados en Horas_Personal_AppSheet, para saber si se puede armar el
# ranking de tractoristas. Se borra apenas se lea el resultado.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  inspeccionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          POWERBI_WORKSPACE_ID: ${{ secrets.POWERBI_WORKSPACE_ID }}
          POWERBI_DATASET_ID: ${{ secrets.POWERBI_DATASET_ID }}
        run: |
          python - <<'PY'
          import os, sys, datetime
          sys.path.insert(0, "scripts")
          from motor_agregacion import (obtener_access_token_service_principal,
                                        cargar_desde_power_bi_service)
          from motor_produccion import _d
          tok = obtener_access_token_service_principal(
              os.environ["AZURE_TENANT_ID"], os.environ["AZURE_CLIENT_ID"],
              os.environ["AZURE_CLIENT_SECRET"])
          ws, ds = os.environ["POWERBI_WORKSPACE_ID"], os.environ["POWERBI_DATASET_ID"]
          hoy = datetime.date.today()
          desde = hoy - datetime.timedelta(days=90)
          print(f"VENTANA: {desde} a {hoy}\n")
          T = "'Horas_Personal_AppSheet'"
          FIL = f"FILTER({T}, {T}[Fecha] >= {_d(desde)} && {T}[Fecha] <= {_d(hoy)})"

          def correr(titulo, dax, n=40):
              print("=" * 72); print(titulo); print("=" * 72)
              try:
                  df = cargar_desde_power_bi_service(ws, ds, dax, tok)
                  print(f"(filas devueltas: {len(df)})")
                  print(df.head(n).to_string(index=False) if len(df) else "(sin filas)")
              except Exception as e:
                  print(f"ERROR: {type(e).__name__}: {str(e)[:300]}")
              print()

          def por_columna(col, alias):
              return f"""
              EVALUATE
              SELECTCOLUMNS(
                SUMMARIZECOLUMNS({T}[{col}], {FIL},
                  "filas", COUNTROWS({T}), "horas", SUM({T}[Horas])),
                "{alias}", {T}[{col}], "filas", [filas], "horas", [horas])
              """

          correr("MOTIVO_ROTURA", por_columna("Motivo_Rotura", "motivo"))
          correr("TIPO_REPARACION", por_columna("Tipo_Reparacion", "tipo_rep"))
          correr("CONDUCTOR (top 40 por horas)", f"""
          EVALUATE
          TOPN(40,
            SELECTCOLUMNS(
              SUMMARIZECOLUMNS({T}[Conductor], {FIL},
                "filas", COUNTROWS({T}), "horas", SUM({T}[Horas])),
              "conductor", {T}[Conductor], "filas", [filas], "horas", [horas]),
            [horas], DESC)
          """)
          correr("CONDUCTOR cargado en salidas a CAMPO", f"""
          EVALUATE
          SELECTCOLUMNS(
            SUMMARIZECOLUMNS(
              FILTER({T}, {T}[Fecha] >= {_d(desde)} && {T}[Fecha] <= {_d(hoy)}
                       && LEFT({T}[Lugar],5) = "CAMPO"),
              "con_conductor", CALCULATE(COUNTROWS({T}), NOT ISBLANK({T}[Conductor])),
              "sin_conductor", CALCULATE(COUNTROWS({T}), ISBLANK({T}[Conductor])),
              "total", COUNTROWS({T})),
            "con_conductor", [con_conductor], "sin_conductor", [sin_conductor], "total", [total])
          """)
          correr("MUESTRA de salidas a campo con texto libre", f"""
          EVALUATE
          TOPN(25,
            SELECTCOLUMNS(
              FILTER({T}, {T}[Fecha] >= {_d(desde)} && {T}[Fecha] <= {_d(hoy)}
                       && LEFT({T}[Lugar],5) = "CAMPO"),
              "fecha", {T}[Fecha], "maquina", {T}[Máquina], "conductor", {T}[Conductor],
              "sub", {T}[Sub Rubro], "motivo", {T}[Motivo_Rotura],
              "tipo_rep", {T}[Tipo_Reparacion], "diag", {T}[diagnostico],
              "motivo_repara", {T}[motivo_repara]),
            [fecha], DESC)
          """, n=25)
          PY
