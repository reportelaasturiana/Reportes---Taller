name: Generar reportes semanales del taller

on:
  schedule:
    # Lunes 09:00 UTC = 06:00 hora Argentina (ART, UTC-3). Ajustar si se quiere
    # otro horario -- el formato es "minuto hora dia-mes mes dia-semana" y "1"
    # en el ultimo campo es lunes.
    - cron: '0 9 * * 1'
  workflow_dispatch: {}  # permite tambien correrlo a mano desde la pestaña "Actions" de GitHub

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo del repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar los 2 reportes con datos en vivo de Power BI
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          POWERBI_WORKSPACE_ID: ${{ secrets.POWERBI_WORKSPACE_ID }}
          POWERBI_DATASET_ID: ${{ secrets.POWERBI_DATASET_ID }}
        run: python scripts/motor_produccion.py

      - name: Preparar el contenido para publicar
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  publicar:
    needs: generar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
