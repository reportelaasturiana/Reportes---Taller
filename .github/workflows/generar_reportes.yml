name: Generar reportes semanales del taller

on:
  schedule:
    # Todos los dias 08:45 UTC = 05:45 hora Argentina (ART, UTC-3 todo el año).
    # Se pide antes de las 6 porque los cron de Actions arrancan TARDE, nunca
    # antes, y los slots en hora exacta son los mas congestionados: el 10/8/2026
    # una corrida salio 2h37m tarde. Apuntando a 05:45 suele quedar cerca de las
    # 6, que es cuando Victor revisa las cargas del dia anterior.
    #
    # Es diario y no semanal a proposito: GitHub Pages publica el SITIO ENTERO en
    # cada despliegue, asi que un workflow aparte que generara solo el informe
    # diario borraria los otros dos al publicar. Una sola corrida arma los tres.
    # El informe semanal no cambia de contenido por correr a diario: siempre
    # reporta la ultima semana ya cerrada.
    - cron: '45 8 * * *'
  workflow_dispatch: {}  # permite tambien correrlo a mano desde la pestaña "Actions" de GitHub

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo del repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar los 2 reportes con datos en vivo de Power BI
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          POWERBI_WORKSPACE_ID: ${{ secrets.POWERBI_WORKSPACE_ID }}
          POWERBI_DATASET_ID: ${{ secrets.POWERBI_DATASET_ID }}
        run: python scripts/motor_produccion.py

      - name: Preparar el contenido para publicar
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  publicar:
    needs: generar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
